[project]
name = "researchd"
version = "0.1.0"
description = "A durable research control system: state, scheduling, scientific decision gating, and reliable reporting"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "click>=8.1",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "ulid-py>=1.1",
]

[project.optional-dependencies]
feishu = [
    "lark-oapi>=1.7",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
researchd = "researchd.cli:main"
researchctl = "researchd.ctl:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
researchd = ["executors/schemas/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast unit tests",
    "integration: integration tests with real components",
    "conformance: executor adapter conformance tests",
    "recovery: failure-injection recovery tests",
    "e2e: end-to-end golden path",
]

[tool.ruff]
line-length = 110
target-version = "py312"
